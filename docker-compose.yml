services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ads
      POSTGRES_USER: ads_user
      POSTGRES_PASSWORD: ads_pass
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54330}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ads_user -d ads"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://ads_user:ads_pass@db:5432/ads
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/advertisements', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
